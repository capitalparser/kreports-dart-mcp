# DART sample corpus manifest.
#
# Keep this file metadata-first. Prefer reproducible DART identifiers and expected
# extraction outputs over storing full raw filings in the repository.

schema_version: 1
principles:
  - "Every case must preserve DART identifiers and extraction route."
  - "Raw filing archives are optional; expected outputs are required before a case becomes a regression fixture."
  - "Do not commit API keys, private client data, or non-public working papers."
  - "When source redistribution is uncertain, store rcept_no plus extraction instructions instead of raw source."

routes:
  structured_financial_api: "fnlttSinglAcntAll.json"
  xbrl_zip: "fnlttXbrlDs003.zip"
  document_xml: "document.xml"
  viewer_html: "DART web viewer fallback for diagnosis"

statuses:
  candidate: "Interesting case identified; expected output not ready."
  expected_defined: "Expected output defined; ready for parser comparison."
  fixture_ready: "Machine-readable fixture/test exists."
  regression_locked: "Included in automated regression tests."

