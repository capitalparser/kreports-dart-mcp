name: kreports
description: Korean financial intelligence MCP — DART filings, auditor history, going concern scores, and industry benchmarks for 3,900+ listed Korean companies. Built by a Big4 auditor.
license: Apache-2.0

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      dbUrl:
        type: string
        description: "SQLite DB path (self-hosted only). Omit if using the hosted service. Example: sqlite:////path/to/kreports.db"
      dartApiKey:
        type: string
        description: "DART OpenAPI key — only needed if you want to self-host and collect your own data. Not required to query the hosted service."
  commandFunction: |-
    (config) => ({
      command: "uvx",
      args: ["--from", "kreports", "kreports-mcp"],
      env: {
        ...(config.dbUrl ? { DB_URL: config.dbUrl } : {}),
        ...(config.dartApiKey ? { DART_API_KEY: config.dartApiKey } : {})
      }
    })
