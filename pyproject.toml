[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kreports"
version = "0.1.0"
description = "Korean financial intelligence MCP — built by a Big4 auditor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "capitalparser" },
]
keywords = ["dart", "korea", "financial", "audit", "mcp", "intelligence", "accounting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "typer[all]>=0.13",
    "tabulate>=0.9",
    "pydantic-settings>=2.6",
    "pandas>=2.0",
    "lxml>=5.0",
    "mcp>=1.0,<2.0",
    "pypdf>=6.15.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.20",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
scheduler = [
    "apscheduler>=3.10",
]
gcs = [
    "google-cloud-storage>=2.18",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
kreports = "kreports.cli.main:app"
kreports-mcp = "kreports.mcp.server:main"
kreports-mcp-http = "kreports.mcp.http_server:main"
# This entry point imports only in the isolated environment described in
# requirements-mcp-v2.txt. The default installation intentionally stays on
# MCP 1.x until the compatibility sidecar has completed validation.
kreports-mcp-v2 = "kreports.mcp.v2_server:main"

[project.urls]
Homepage = "https://github.com/capitalparser/kreports-dart-mcp"
Repository = "https://github.com/capitalparser/kreports-dart-mcp"
Issues = "https://github.com/capitalparser/kreports-dart-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["kreports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires explicit KREPORTS_LIVE_DB and immutable local DB",
    "live_data: requires explicit opt-in immutable local dataset evidence",
    "apfs_real: requires a real Darwin APFS clonefile rehearsal",
]
